<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorry Pikachu ❤️</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Quicksand',sans-serif;
}


body{

min-height:100vh;

background:linear-gradient(135deg,#fff3a8,#ffd6e8);

display:flex;

justify-content:center;

align-items:center;

padding:20px;

overflow:auto;

}



/* card */
.card{
width:95%;
max-width:520px;
background:white;
padding:20px;
border-radius:35px;
max-height:90vh;
overflow:hidden;
}



@keyframes pop{

from{
transform:scale(.7);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}



/* mascot */


.mascot{

margin-bottom:10px;

animation:bounce 2s infinite;

}


.face{

width:90px;

height:90px;

margin:auto;

background:#ffd92f;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

font-size:45px;

box-shadow:0 10px 20px rgba(255,180,0,.3);

}


.ears{

font-size:30px;

color:#f5b400;

}



.sign{

margin:12px auto;

background:#fff;

padding:8px 18px;

border-radius:20px;

width:max-content;

color:#ff6fa3;

font-weight:bold;

}



@keyframes bounce{

50%{
transform:translateY(-12px);
}

}



/* heading */


h1{

color:#f5b400;

font-size:35px;

}



/* message box */


.message{
    margin-top:15px;
    height:160px;
    overflow-y:auto;
    text-align:left;
    white-space:pre-line;
    line-height:1.6;
    color:#555;
    padding-right:8px;
}



/* buttons */


.button-area{

display:flex;

justify-content:space-between;

gap:20px;

margin-top:15px;

position:relative;

z-index:10;

}


.button-area a{

flex:1;

}


.button-area button{

display:block;

width:100%;

padding:14px 8px;

}
button{

width:100%;

padding:13px 10px;

border:none;

border-radius:50px;

background:#ff6fa3;

color:white;

font-size:15px;

cursor:pointer;

}



button:hover{

transform:scale(1.08);

}



/* floating emojis */


.float{

position:absolute;

bottom:-50px;

animation:up 8s linear infinite;

}



@keyframes up{

100%{

transform:translateY(-110vh);

opacity:0;

}

}


</style>

</head>



<body>



<div class="card">



<div class="mascot">

<div class="ears">
⚡ ⚡
</div>


<div class="face">
🥺
</div>


<div class="sign">
SORRY BATMAN 🦇❤️
</div>

</div>



<h1>
Sorry Pikachu ❤️⚡
</h1>



<div class="message" id="text"></div>



<div class="button-area">


<a href="final.html">

<button>
Yes ❤️
</button>

</a>



<a href="sorry.html">

<button>
Not yet 😤
</button>

</a>


</div>



</div>





<script>


let message=`Hi Pikachu ❤️⚡


I wanted to tell you something from my heart 🥺


I'm really sorry that I didn't see you calling me.

I know our plan after the movie didn't happen 🍽️💔


I wasn't ignoring you.

I understand that it must have felt disappointing.


You mean a lot to me ❤️

and I never want you to feel unimportant never ever.


I hope we can make another plan soon 🌸✨


With care,

Batman 🦇❤️`;



let i=0;


function typing(){

if(i<message.length){

document.getElementById("text").innerHTML += message.charAt(i);

i++;

setTimeout(typing,25);

}

}


typing();




function createEmoji(){

let e=document.createElement("div");

e.className="float";


let list=[
"❤️",
"⚡",
"🌸",
"✨",
"💛"
];


e.innerHTML=list[Math.floor(Math.random()*list.length)];


e.style.left=Math.random()*100+"vw";

e.style.fontSize=(20+Math.random()*25)+"px";

e.style.animationDuration=(6+Math.random()*4)+"s";


document.body.appendChild(e);


setTimeout(()=>{

e.remove();

},9000);


}


setInterval(createEmoji,900);



</script>


</body>

</html>
