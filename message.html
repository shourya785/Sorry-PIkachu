<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorry Pikachu ⚡❤️</title>

<style>
    .choices{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:20px;
    position:relative;
z-index:5;     
}


.choices button{
    padding:12px 20px;
}


#sadBox{
    margin-top:20px;
}


.sad{
    font-size:70px;
    animation:shake 0.8s infinite;
}


@keyframes shake{
    0%{transform:rotate(0);}
    25%{transform:rotate(10deg);}
    50%{transform:rotate(-10deg);}
    75%{transform:rotate(10deg);}
    100%{transform:rotate(0);}
}
.mascot{
    margin-bottom:15px;
    animation:bounce 2s infinite;
}


.ears{
    font-size:35px;
    color:#f5b400;
}


.face{
    width:90px;
    height:90px;
    margin:auto;
    background:#ffd92f;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    box-shadow:0 8px 20px rgba(255,180,0,.4);
}


.sign{
    margin:15px auto;
    background:white;
    padding:10px 20px;
    border-radius:15px;
    width:max-content;
    color:#ff5c93;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}


@keyframes bounce{

50%{
    transform:translateY(-12px);
}

}
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Quicksand',sans-serif;
}


body{
    min-height:100vh;
    overflow-y:auto;
    background:linear-gradient(135deg,#fff3a8,#ffd6e8);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
}


/* floating emojis */

.float{
    position:absolute;
    bottom:-50px;
    animation:up 8s linear infinite;
}


@keyframes up{

0%{
    transform:translateY(0) rotate(0deg);
    opacity:0;
}

20%{
    opacity:1;
}

100%{
    transform:translateY(-110vh) rotate(360deg);
    opacity:0;
}

}



.card{
    width:90%;
    max-width:520px;
    background:white;
    padding:30px;
    border-radius:35px;
    max-height:90vh;
    overflow:hidden;
}

@keyframes pop{

from{
transform:scale(.7);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}



h1{

font-size:42px;
color:#f5b400;

}



.pika{

font-size:55px;

animation:bounce 1.5s infinite;

}



@keyframes bounce{

50%{
transform:translateY(-15px);
}

}



.message{
    margin-top:20px;
    color:#555;
    line-height:1.7;
    white-space:pre-line;
    height:220px;
    overflow-y:auto;
    padding-right:10px;
}



button{

margin-top:20px;

background:#f5b400;

border:none;

padding:15px 35px;

border-radius:50px;

color:white;

font-size:17px;

cursor:pointer;

box-shadow:0 10px 20px rgba(245,180,0,.3);

}



button:hover{

transform:scale(1.1);

}



a{
text-decoration:none;
}


</style>

</head>


<body>


<div class="card">


<div class="mascot">

<div class="ears">
⚡      ⚡
</div>

<div class="face">
🥺
</div>

<div class="sign">
SORRY FROM BATMAN 🦇❤️
</div>

</div>


<h1>
Sorry Pikachu ❤️
</h1>


<p>
A little message from Batman 🦇
</p>



<div class="message" id="text"></div>


<div class="message" id="text"></div>


<div class="button-area" id="choice">

<a href="final.html">
<button>
Yes, I forgive you ❤️
</button>
</a>


<a href="sorry.html">
<button>
Not yet 😤
</button>
</a>

</div>

</div>


<div id="sadBox" style="display:none;">

<div class="sad">
😭
</div>

<h3>
Aww 🥺 Batman is sorry...
</h3>

<p>
Please forgive me Pikachu ❤️⚡
</p>


<a href="final.html">

<button>
Okay, forgive Batman 🦇❤️
</button>

</a>

</div>



<script>


let message = `Hi Pikachu ❤️⚡

I wanted to tell you something from my heart 🥺💛

I'm really sorry that I didn't see you calling me 📱
and couldn't gather the courage to talk to you.

I know i wanted to spend more time together after the movie 🎬
and I feel bad that our plan didn't happen 🍽️💔

I wasn't ignoring you 🥺
I understand that it must have felt disappointing.

You mean a lot to me ❤️(a lot)
and I never want you to feel unimportant never ever.

I hope we can make another plan soon  and i wont miss the second chance to spend time with you🌸✨

With care,
Batman 🦇❤️`;



let i=0;


function typing(){

if(i<message.length){

document.getElementById("text").innerHTML += message[i];

i++;

setTimeout(typing,20);

}

}

typing();



function createEmoji(){

let e=document.createElement("div");

e.className="float";


let emojis=[
"⚡",
"❤️",
"💛",
"✨",
"🌸",
"🥺"
];


e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];


e.style.left=Math.random()*100+"vw";

e.style.fontSize=(20+Math.random()*25)+"px";

e.style.animationDuration=(5+Math.random()*5)+"s";


document.body.appendChild(e);


setTimeout(()=>{

e.remove();

},9000);

}


setInterval(createEmoji,900);

function sad(){

document.getElementById("sadBox").style.display="block";

}


function forgive(){

document.getElementById("sadBox").style.display="block";

}
</script>


</body>
</html>
