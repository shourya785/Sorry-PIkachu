<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorry Pikachu ⚡❤️</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Quicksand',sans-serif;
}


body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#fff3a8,#ffd6e8);
    display:flex;
    justify-content:center;
    align-items:center;
}


/* floating emojis */

.float{
    position:absolute;
    bottom:-50px;
    animation:up 8s linear infinite;
}


@keyframes up{

0%{
    transform:translateY(0) rotate(0deg);
    opacity:0;
}

20%{
    opacity:1;
}

100%{
    transform:translateY(-110vh) rotate(360deg);
    opacity:0;
}

}



.card{

width:90%;
max-width:520px;

background:rgba(255,255,255,.92);

padding:35px;

border-radius:35px;

text-align:center;

box-shadow:0 20px 50px rgba(255,180,0,.25);

animation:pop 1s;

}



@keyframes pop{

from{
transform:scale(.7);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}



h1{

font-size:42px;
color:#f5b400;

}



.pika{

font-size:55px;

animation:bounce 1.5s infinite;

}



@keyframes bounce{

50%{
transform:translateY(-15px);
}

}



.message{

margin-top:20px;

text-align:left;

color:#555;

line-height:1.8;

white-space:pre-line;

min-height:260px;

}



button{

margin-top:20px;

background:#f5b400;

border:none;

padding:15px 35px;

border-radius:50px;

color:white;

font-size:17px;

cursor:pointer;

box-shadow:0 10px 20px rgba(245,180,0,.3);

}



button:hover{

transform:scale(1.1);

}



a{
text-decoration:none;
}


</style>

</head>


<body>


<div class="card">


<div class="pika">
⚡
</div>


<h1>
Sorry Pikachu ❤️
</h1>


<p>
A little message from Batman 🦇
</p>



<div class="message" id="text"></div>



<a href="final.html">

<button>
Forgive Batman? ⚡❤️
</button>

</a>


</div>



<script>


let message = `Hi Pikachu ❤️⚡

I wanted to tell you something from my heart 🥺💛

I'm really sorry that I didn't see your call 📱
and couldn't gather the courage to talk to you.

I know we wanted to spend more time together after the movie 🎬
and I feel bad that our restaurant plan didn't happen 🍽️💔

I wasn't ignoring you 🥺
I understand that it must have felt disappointing.

You mean a lot to me ❤️
and I never want you to feel unimportant.

I hope we can make another plan soon 🌸✨

With care,
Batman 🦇❤️`;



let i=0;


function typing(){

if(i<message.length){

document.getElementById("text").innerHTML += message[i];

i++;

setTimeout(typing,35);

}

}

typing();



function createEmoji(){

let e=document.createElement("div");

e.className="float";


let emojis=[
"⚡",
"❤️",
"💛",
"✨",
"🌸",
"🥺"
];


e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];


e.style.left=Math.random()*100+"vw";

e.style.fontSize=(20+Math.random()*25)+"px";

e.style.animationDuration=(5+Math.random()*5)+"s";


document.body.appendChild(e);


setTimeout(()=>{

e.remove();

},9000);

}


setInterval(createEmoji,400);


</script>


</body>
</html>
