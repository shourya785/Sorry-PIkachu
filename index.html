<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Pikachu ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Quicksand',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ffd6e8,#fff7fb);
    display:flex;
    justify-content:center;
    align-items:center;
}


/* floating hearts */

.heart{
    position:absolute;
    bottom:-50px;
    animation:float 8s linear infinite;
    opacity:.7;
}

@keyframes float{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}


.card{
    width:90%;
    max-width:450px;
    background:rgba(255,255,255,.85);
    padding:35px;
    border-radius:35px;
    text-align:center;
    box-shadow:0 20px 50px rgba(255,100,150,.25);
    animation:appear 1.5s ease;
}


@keyframes appear{
    from{
        opacity:0;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


h1{
    color:#ff5c93;
    font-size:45px;
}


.subtitle{
    color:#888;
    margin:10px;
}


.photo{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;
    border:6px solid #ffd1e3;
    margin:20px;
    animation:pulse 2s infinite;
}


@keyframes pulse{
    50%{
        transform:scale(1.05);
    }
}


button{

    background:#ff6fa3;
    color:white;
    border:none;

    padding:15px 35px;

    border-radius:50px;

    font-size:17px;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    transform:scale(1.1);

    background:#ff4f8b;

}


a{
    text-decoration:none;
}

</style>

</head>


<body>


<div class="card">


<h1>
Hi Pikachu ❤️
</h1>


<p class="subtitle">
A small surprise from Batman 🦇
</p>


<img src="photo.jpg" class="photo">


<p style="color:#555; line-height:1.7;">
I made something special for you 🌸
</p>


<a href="message.html">

<button>
Open My Heart 💌
</button>

</a>


</div>



<script>


function createHeart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML=["❤️","💖","🌸","💕"][Math.floor(Math.random()*4)];

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*25)+"px";

h.style.animationDuration=(5+Math.random()*5)+"s";


document.body.appendChild(h);


setTimeout(()=>{

h.remove();

},9000);


}


setInterval(createHeart,350);


</script>


</body>
</html>
